name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  DOTNET_VERSION: '8.0.x'
  NODE_VERSION: '24.x'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/DeployManager.Client/package-lock.json

      - name: Install frontend dependencies
        working-directory: src/DeployManager.Client
        run: npm ci

      - name: Build frontend
        working-directory: src/DeployManager.Client
        run: npm run build

      - name: Publish backend
        run: dotnet publish src/DeployManager.Api/DeployManager.Api.csproj -c Release -o ${{ runner.temp }}/publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: deploy-package
          path: ${{ runner.temp }}/publish
          retention-days: 3

  deploy:
    name: Deploy to Azure
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: deploy-package
          path: ${{ runner.temp }}/publish

      - name: Zip artifact
        run: cd ${{ runner.temp }}/publish && zip -r ${{ runner.temp }}/deploy.zip .

      - name: Azure Login
        run: |
          az login --service-principal \
            --username "${{ secrets.AZURE_CLIENT_ID }}" \
            --password "${{ secrets.AZURE_CLIENT_SECRET }}" \
            --tenant "${{ secrets.AZURE_TENANT_ID }}"

      - name: Deploy to Azure
        run: |
          az webapp deploy \
            --name "${{ secrets.AZURE_WEBAPP_NAME }}" \
            --resource-group "valgreti_grupo1" \
            --src-path "${{ runner.temp }}/deploy.zip" \
            --type zip \
            --clean true

      - name: Wait for app to start
        run: sleep 30

      - name: Health check
        run: |
          APP_URL="https://${{ secrets.AZURE_WEBAPP_NAME }}.azurewebsites.net"
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$APP_URL/health" || true)
            if [ "$STATUS" = "200" ]; then
              echo "Health check passed (HTTP $STATUS)"
              exit 0
            fi
            echo "Attempt $i: HTTP $STATUS — retrying in 10s..."
            sleep 10
          done
          echo "Health check failed after 5 attempts"
          exit 1

      - name: Logout
        run: az logout

  notify:
    name: Notify
    if: always()
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Deployment result
        run: |
          if [ "${{ needs.deploy.result }}" = "success" ]; then
            echo "Production deploy succeeded"
          else
            echo "Production deploy failed — check logs"
            exit 1
          fi
